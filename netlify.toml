# lockeddoor.ai is a static site: publish web/ as-is, nothing to build or install.
[build]
  publish = "web"
  command = "echo static site, nothing to build"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
