# lockeddoor.ai is a static site: publish web/ as-is, nothing to build or install.
[build]
  publish = "web"
  command = "echo static site, nothing to build"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Old misspelling: keep saved / indexed links working after the Pellegrin rename.
[[redirects]]
  from = "/areas/pellegrjn.html"
  to = "/areas/pellegrin.html"
  status = 301

[[redirects]]
  from = "/areas/pellegrjn"
  to = "/areas/pellegrin"
  status = 301
