<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KEYHOLE</title>
  <meta name="description" content="KEYHOLE Live WebCam Show" />
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" />
  <style>
    :root {
      --bg-black: #000000;
      --gold: #D4AF37;
      --gold-border: rgba(212, 175, 55, 0.6);
      --white: #FFFFFF;
      --muted: #A0A0A0;
      --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-serif: "Playfair Display", Georgia, serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-black);
      color: var(--white);
      font-family: var(--font-main);
      line-height: 1.5;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: #000000;
    }

    /* Top Bar */
    .topbar {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-logo {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 0.22em;
      color: var(--gold);
      text-decoration: none;
      text-transform: uppercase;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .btn-signin {
      color: var(--white);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      background: none;
      border: none;
    }

    .btn-signin:hover {
      text-decoration: underline;
    }

    .btn-create {
      color: var(--gold);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      padding: 8px 18px;
      border: 1px solid var(--gold);
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-create:hover {
      background: rgba(212, 175, 55, 0.1);
    }

    /* Main Container */
    .landing-container {
      flex: 1;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 60px 24px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .landing-header {
      margin-bottom: 60px;
      text-align: center;
    }

    .landing-header h1 {
      font-size: clamp(2.5rem, 6vw, 4.2rem);
      font-weight: 400;
      color: var(--white);
      letter-spacing: 0.02em;
    }

    /* Roster Cards Grid */
    .roster-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 36px;
    }

    .girl-card {
      background: #000000;
      border: 1px solid var(--gold-border);
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.25s ease, transform 0.25s ease;
      display: flex;
      flex-direction: column;
    }

    .girl-card:hover {
      border-color: var(--gold);
      transform: translateY(-4px);
    }

    .girl-photo {
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    .girl-info {
      padding: 24px 24px 28px;
      text-align: left;
    }

    .girl-name {
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--white);
      margin-bottom: 6px;
    }

    .girl-tagline {
      color: var(--gold);
      font-size: 1rem;
      font-weight: 500;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
      display: inline-block;
    }

    .girl-bio-line {
      color: var(--white);
      font-size: 1.02rem;
      line-height: 1.5;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .landing-container {
        padding: 40px 20px 60px;
      }
      .roster-grid {
        grid-template-columns: 1fr;
        gap: 28px;
      }
      .landing-header h1 {
        font-size: 2.8rem;
      }
    }

    /* Modal / Living Room View Styles */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(8px);
      display: none;
      place-items: center;
      padding: 20px;
    }

    .modal-backdrop.is-open {
      display: grid;
    }

    .auth-box {
      width: min(420px, 100%);
      background: #0D0D0D;
      border: 1px solid var(--gold-border);
      border-radius: 8px;
      padding: 32px;
      position: relative;
    }

    .auth-close {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.6rem;
      cursor: pointer;
    }

    .auth-close:hover { color: var(--white); }

    .auth-title {
      font-size: 1.5rem;
      color: var(--white);
      margin-bottom: 20px;
      text-align: center;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .auth-input {
      width: 100%;
      padding: 12px 16px;
      background: #181818;
      border: 1px solid #333;
      border-radius: 4px;
      color: var(--white);
      font-size: 0.95rem;
    }

    .auth-input:focus {
      outline: none;
      border-color: var(--gold);
    }

    .btn-gold-submit {
      width: 100%;
      padding: 12px;
      background: var(--gold);
      color: #000;
      font-weight: 700;
      font-size: 1rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn-gold-submit:hover {
      background: #e5be3d;
    }

    .auth-switch-text {
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
      margin-top: 14px;
    }

    .auth-switch-text a {
      color: var(--gold);
      cursor: pointer;
      text-decoration: underline;
    }

    /* Living Room / Bedroom WebCam Viewer Panel */
    .webcam-panel {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: #000000;
      display: none;
      flex-direction: column;
    }

    .webcam-panel.is-open {
      display: flex;
    }

    .webcam-header {
      padding: 16px 24px;
      background: rgba(0, 0, 0, 0.95);
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .webcam-title {
      font-size: 1.2rem;
      color: var(--gold);
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .webcam-close {
      background: none;
      border: none;
      color: var(--white);
      font-size: 1.8rem;
      cursor: pointer;
    }

    .webcam-body {
      flex: 1;
      display: flex;
      flex-direction: row;
      overflow: hidden;
      position: relative;
    }

    .webcam-stage {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050505;
      overflow: hidden;
    }

    .room-bg-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.95;
      transition: opacity 0.5s ease-in-out;
    }

    .webcam-media-overlay {
      position: relative;
      z-index: 10;
      width: min(880px, 85vw);
      aspect-ratio: 16 / 9;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--gold-border);
      border-radius: 8px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.85);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .webcam-media-overlay img,
    .webcam-media-overlay video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Chat Drawer / Sidebar */
    .webcam-chat-sidebar {
      width: 320px;
      background: #080808;
      border-left: 1px solid rgba(212, 175, 55, 0.3);
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      padding: 14px 16px;
      background: #000;
      border-bottom: 1px solid #222;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chat-msg {
      font-size: 0.88rem;
      line-height: 1.4;
      background: #121212;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #222;
    }

    .chat-msg .sender {
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 2px;
      font-size: 0.8rem;
    }

    .chat-msg .text {
      color: var(--white);
    }

    .webcam-controls {
      padding: 16px 24px;
      background: #0a0a0a;
      border-top: 1px solid rgba(212, 175, 55, 0.3);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .show-options {
      display: flex;
      gap: 12px;
    }

    .btn-show-type {
      padding: 10px 18px;
      border: 1px solid var(--gold);
      background: transparent;
      color: var(--gold);
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .btn-show-type.active, .btn-show-type:hover {
      background: var(--gold);
      color: #000000;
    }

    .chat-input-bar {
      flex: 1;
      display: flex;
      gap: 10px;
    }

    .chat-input-bar input {
      flex: 1;
      padding: 10px 14px;
      background: #181818;
      border: 1px solid #333;
      border-radius: 4px;
      color: var(--white);
    }

    .chat-input-bar button {
      padding: 10px 20px;
      background: var(--gold);
      color: #000;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header class="topbar">
    <a href="#" class="brand-logo">KEYHOLE</a>
    <div class="topbar-actions">
      <button class="btn-signin" id="btn-top-signin">Sign in</button>
      <button class="btn-create" id="btn-top-create">Create account</button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="landing-container">
    <div class="landing-header">
      <h1>Meet the girls.</h1>
    </div>

    <div class="roster-grid">
      <!-- Chloe Card -->
      <article class="girl-card" id="card-chloe" data-girl="chloe">
        <img src="assets/webcam/IMG_4057.jpeg" alt="Chloe" class="girl-photo" />
        <div class="girl-info">
          <div class="girl-name">Chloe</div>
          <div class="girl-tagline">Night owl.</div>
          <div class="girl-bio-line">Dirty-blonde. City apartment.</div>
          <div class="girl-bio-line">Here when you are.</div>
        </div>
      </article>

      <!-- Bailey Card -->
      <article class="girl-card" id="card-bailey" data-girl="bailey">
        <img src="assets/webcam/IMG_3973.jpeg" alt="Bailey" class="girl-photo" />
        <div class="girl-info">
          <div class="girl-name">Bailey</div>
          <div class="girl-tagline">The girl next-door.</div>
          <div class="girl-bio-line">Dark hair. Old house.</div>
          <div class="girl-bio-line">Notices you later.</div>
        </div>
      </article>
    </div>
  </main>

  <!-- Auth Modal -->
  <div class="modal-backdrop" id="auth-modal">
    <div class="auth-box">
      <button class="auth-close" id="auth-modal-close">&times;</button>
      <div class="auth-title" id="auth-modal-title">Sign in</div>

      <!-- Login Form -->
      <form id="login-form" class="auth-form">
        <input type="email" id="login-email" class="auth-input" placeholder="Email" required />
        <input type="password" id="login-password" class="auth-input" placeholder="Password" required />
        <button type="submit" class="btn-gold-submit">Sign in</button>
        <div class="auth-switch-text">
          New here? <a id="link-to-signup">Create an account</a>
        </div>
      </form>

      <!-- Signup Form -->
      <form id="signup-form" class="auth-form" style="display: none;">
        <input type="text" id="signup-name" class="auth-input" placeholder="Display name" required />
        <input type="email" id="signup-email" class="auth-input" placeholder="Email" required />
        <input type="password" id="signup-password" class="auth-input" placeholder="Password (8+ chars)" required />
        <button type="submit" class="btn-gold-submit">Create account</button>
        <div class="auth-switch-text">
          Already have an account? <a id="link-to-login">Sign in</a>
        </div>
      </form>
    </div>
  </div>

  <!-- Living Room / Bedroom WebCam Viewer Panel -->
  <div class="webcam-panel" id="webcam-panel">
    <div class="webcam-header">
      <div class="webcam-title" id="webcam-room-title">CHLOE &mdash; LIVING ROOM PREVIEW</div>
      <button class="webcam-close" id="webcam-close-btn">&times;</button>
    </div>

    <div class="webcam-body">
      <div class="webcam-stage" id="webcam-stage">
        <!-- Room Background Overlay -->
        <img src="" class="room-bg-layer" id="room-bg-img" alt="Room Background" />

        <!-- Media Display Overlay (Image or Video) -->
        <div class="webcam-media-overlay" id="media-overlay">
          <img id="webcam-image" src="" alt="Live Stream" style="display: none;" />
          <video id="webcam-video" autoplay loop muted playsinline style="display: none;"></video>
        </div>
      </div>

      <!-- Chat Sidebar -->
      <div class="webcam-chat-sidebar">
        <div class="chat-header" id="chat-header-title">Live Chat</div>
        <div class="chat-messages" id="chat-messages-container">
          <!-- Chat messages rendered dynamically -->
        </div>
      </div>
    </div>

    <div class="webcam-controls">
      <div class="show-options">
        <button class="btn-show-type active" id="btn-show-preview" data-type="preview">Living Room Preview</button>
        <button class="btn-show-type" id="btn-show-group" data-type="group">Group Show ($4.99)</button>
        <button class="btn-show-type" id="btn-show-private" data-type="private">1-on-1 Bedroom ($19.99)</button>
      </div>

      <div class="chat-input-bar">
        <input type="text" id="show-chat-input" placeholder="Say something..." />
        <button type="button" id="show-chat-send">Send</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE_URL = "https://sorority-house-production-aeb5.up.railway.app";
    const TOKEN_KEY = 'keyhole_user_token';

    function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }
    function isLoggedIn() { return !!getToken(); }

    // Auth Modal Handlers
    const authModal = document.getElementById('auth-modal');
    const authModalClose = document.getElementById('auth-modal-close');
    const loginForm = document.getElementById('login-form');
    const signupForm = document.getElementById('signup-form');
    const authTitle = document.getElementById('auth-modal-title');
    const btnTopSignin = document.getElementById('btn-top-signin');
    const btnTopCreate = document.getElementById('btn-top-create');
    const linkToSignup = document.getElementById('link-to-signup');
    const linkToLogin = document.getElementById('link-to-login');

    function openAuth(mode) {
      authModal.classList.add('is-open');
      if (mode === 'signup') {
        loginForm.style.display = 'none';
        signupForm.style.display = 'flex';
        authTitle.textContent = 'Create account';
      } else {
        signupForm.style.display = 'none';
        loginForm.style.display = 'flex';
        authTitle.textContent = 'Sign in';
      }
    }

    function closeAuth() { authModal.classList.remove('is-open'); }

    btnTopSignin.addEventListener('click', () => {
      if (isLoggedIn()) {
        localStorage.removeItem(TOKEN_KEY);
        btnTopSignin.textContent = 'Sign in';
      } else {
        openAuth('login');
      }
    });

    btnTopCreate.addEventListener('click', () => openAuth('signup'));
    authModalClose.addEventListener('click', closeAuth);
    linkToSignup.addEventListener('click', () => openAuth('signup'));
    linkToLogin.addEventListener('click', () => openAuth('login'));

    if (isLoggedIn()) {
      btnTopSignin.textContent = 'Sign out';
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      try {
        const res = await fetch(API_BASE_URL + '/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok && data.token) {
          localStorage.setItem(TOKEN_KEY, data.token);
          btnTopSignin.textContent = 'Sign out';
          closeAuth();
        } else {
          alert(data.detail || 'Sign in failed.');
        }
      } catch (err) { alert('Could not reach backend.'); }
    });

    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('signup-name').value;
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      try {
        const res = await fetch(API_BASE_URL + '/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ display_name: name, email, password })
        });
        const data = await res.json();
        if (res.ok) {
          alert('Account created! Please sign in.');
          openAuth('login');
        } else {
          alert(data.detail || 'Signup failed.');
        }
      } catch (err) { alert('Could not reach backend.'); }
    });

    // WebCam Viewer Configuration & State
    const roomAssets = {
      chloe: {
        bg: 'assets/webcam/90667621-79BC-49D5-8CC5-D076C4A19BC3.jpeg',
        preview: 'assets/webcam/IMG_4057.jpeg',
        group: 'assets/webcam/IMG_3543.jpeg',
        private: 'assets/webcam/IMG_3544.jpeg',
        welcomeMsg: "Chloe: Hey there. Welcome to my apartment... lounge for a bit."
      },
      bailey: {
        bg: 'assets/webcam/EFDC911E-AD2D-4701-83C2-7497C7B063B0.jpeg',
        preview: 'assets/webcam/IMG_3973.jpeg',
        group: 'assets/webcam/IMG_3364.jpeg',
        private: 'assets/webcam/IMG_3363.jpeg',
        welcomeMsg: "Bailey: Hi! Welcome to my place. Let me know if you need anything."
      }
    };

    const webcamPanel = document.getElementById('webcam-panel');
    const webcamCloseBtn = document.getElementById('webcam-close-btn');
    const webcamRoomTitle = document.getElementById('webcam-room-title');
    const roomBgImg = document.getElementById('room-bg-img');
    const webcamImg = document.getElementById('webcam-image');
    const webcamVideo = document.getElementById('webcam-video');
    const chatContainer = document.getElementById('chat-messages-container');
    const chatInput = document.getElementById('show-chat-input');
    const chatSendBtn = document.getElementById('show-chat-send');
    const chatHeaderTitle = document.getElementById('chat-header-title');

    let activeGirl = 'chloe';
    let currentMode = 'preview';

    function addChatMessage(sender, text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'chat-msg';
      msgDiv.innerHTML = `<div class="sender">${sender}</div><div class="text">${text}</div>`;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function renderMedia(mediaUrl) {
      if (!mediaUrl) return;
      const isVideo = mediaUrl.endsWith('.mp4') || mediaUrl.endsWith('.webm');
      if (isVideo) {
        webcamImg.style.display = 'none';
        webcamVideo.style.display = 'block';
        webcamVideo.src = mediaUrl;
        webcamVideo.play().catch(() => {});
      } else {
        webcamVideo.pause();
        webcamVideo.style.display = 'none';
        webcamImg.style.display = 'block';
        webcamImg.src = mediaUrl;
      }
    }

    function loadShowMode(mode) {
      currentMode = mode;
      const config = roomAssets[activeGirl];
      roomBgImg.src = config.bg;
      chatHeaderTitle.textContent = `${activeGirl.toUpperCase()} • ${mode.toUpperCase()} CHAT`;

      if (mode === 'preview') {
        webcamRoomTitle.textContent = `${activeGirl.toUpperCase()} \u2014 LIVING ROOM PREVIEW`;
        renderMedia(config.preview);
      } else if (mode === 'group') {
        webcamRoomTitle.textContent = `${activeGirl.toUpperCase()} \u2014 GROUP SHOW ($4.99)`;
        renderMedia(config.group);
      } else if (mode === 'private') {
        webcamRoomTitle.textContent = `${activeGirl.toUpperCase()} \u2014 1-ON-1 BEDROOM ($19.99)`;
        renderMedia(config.private);
      }
    }

    function openWebcamShow(girl) {
      if (!isLoggedIn()) {
        openAuth('login');
        return;
      }
      activeGirl = girl;
      chatContainer.innerHTML = '';
      addChatMessage('System', `Connected to ${girl.charAt(0).toUpperCase() + girl.slice(1)}'s room.`);
      addChatMessage(girl.charAt(0).toUpperCase() + girl.slice(1), roomAssets[girl].welcomeMsg);

      setActiveOption(btnPreview);
      loadShowMode('preview');
      webcamPanel.classList.add('is-open');
    }

    document.getElementById('card-chloe').addEventListener('click', () => openWebcamShow('chloe'));
    document.getElementById('card-bailey').addEventListener('click', () => openWebcamShow('bailey'));
    webcamCloseBtn.addEventListener('click', () => {
      webcamVideo.pause();
      webcamPanel.classList.remove('is-open');
    });

    const btnPreview = document.getElementById('btn-show-preview');
    const btnGroup = document.getElementById('btn-show-group');
    const btnPrivate = document.getElementById('btn-show-private');

    function setActiveOption(btn) {
      [btnPreview, btnGroup, btnPrivate].forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    btnPreview.addEventListener('click', () => {
      setActiveOption(btnPreview);
      loadShowMode('preview');
    });

    btnGroup.addEventListener('click', () => {
      setActiveOption(btnGroup);
      loadShowMode('group');
    });

    btnPrivate.addEventListener('click', () => {
      setActiveOption(btnPrivate);
      loadShowMode('private');
    });

    function handleSendChat() {
      const text = chatInput.value.trim();
      if (!text) return;
      addChatMessage('You', text);
      chatInput.value = '';

      // Simulate character reply after brief delay
      setTimeout(() => {
        const girlName = activeGirl.charAt(0).toUpperCase() + activeGirl.slice(1);
        let replyText = `Thanks for chatting! (${currentMode} mode)`;
        if (activeGirl === 'chloe') {
          replyText = currentMode === 'private' ? "I'm so glad we're 1-on-1 right now." : "Hey! Glad you're hanging out with me.";
        } else {
          replyText = currentMode === 'private' ? "Just you and me now." : "Hi there! Welcome to the show!";
        }
        addChatMessage(girlName, replyText);
      }, 1000);
    }

    chatSendBtn.addEventListener('click', handleSendChat);
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleSendChat();
    });
  </script>
</body>
</html>
